<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방문 통계 - 유목의 물빛사진</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: var(--sans); line-height: 1.6; }
        main.stats { max-width: 980px; margin: 0 auto; padding: 48px 20px 80px; }
        .stats h1 { margin: 0 0 6px; font-family: var(--serif); font-weight: 400; font-size: 1.7em; letter-spacing: 0.08em; }
        .stats .sub { margin: 0 0 34px; font-size: 0.86em; color: var(--text-muted); }
        .stats .sub a { color: var(--text-secondary); }
        .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 40px; }
        .tile { padding: 18px 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); }
        .tile b { display: block; font-family: var(--serif); font-weight: 400; font-size: 2em; line-height: 1.2; font-variant-numeric: tabular-nums; }
        .tile span { font-size: 0.8em; letter-spacing: 0.06em; color: var(--text-muted); }
        .stats h2 { margin: 40px 0 14px; font-size: 0.9em; font-weight: 400; letter-spacing: 0.24em; text-transform: uppercase; color: var(--text-muted); }
        .bars { display: grid; grid-template-columns: max-content 1fr max-content; gap: 7px 14px; align-items: center; font-size: 0.88em; }
        .bars i { display: block; height: 10px; min-width: 2px; background: var(--accent); border-radius: 5px; opacity: 0.8; }
        .bars em { font-style: normal; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
        .days { display: flex; align-items: flex-end; gap: 2px; height: 150px; padding: 8px 0 0; border-bottom: 1px solid var(--border); }
        .days i { flex: 1 1 0; min-width: 2px; background: var(--accent); border-radius: 2px 2px 0 0; opacity: 0.75; }
        .days i:hover { opacity: 1; }
        .axis { display: flex; justify-content: space-between; margin-top: 6px; font-size: 0.75em; color: var(--text-muted); }
        table { width: 100%; border-collapse: collapse; font-size: 0.86em; font-variant-numeric: tabular-nums; }
        th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--border-subtle); }
        th:first-child, td:first-child { text-align: left; }
        th { font-weight: 400; color: var(--text-muted); }
        #error { color: #e2a08a; }
    </style>
</head>
<body>
    <main class="stats">
        <h1>방문 통계</h1>
        <p class="sub">쿠키 없이 합계만 셉니다. 누가 방문했는지는 기록하지 않습니다. · <a href="index.html">처음으로</a></p>
        <p id="error" hidden>통계 서버에 연결하지 못했습니다.</p>
        <div class="tiles" id="tiles"></div>
        <h2>날짜별 방문</h2>
        <div class="days" id="days"></div>
        <div class="axis"><span id="d0"></span><span id="d1"></span></div>
        <h2>언어별 페이지 열람</h2>
        <div class="bars" id="langs"></div>
        <h2>페이지별 열람</h2>
        <div class="bars" id="pages"></div>
        <h2>날짜별 기록</h2>
        <table><thead><tr><th>날짜</th><th>방문</th><th>페이지 열람</th><th>헌화</th></tr></thead><tbody id="rows"></tbody></table>
    </main>
    <script type="module">
        import { REALTIME } from './exhibition/config.js';
        const NAMES = { home: '대문', about: '작가 소개', license: '라이선스', work: '작품 페이지', hall: '3D 전시관', 'album-abstract': '추상 앨범', 'album-reflection': '반영 앨범',
            'album-pattern': '문양 앨범', 'album-landscape': '풍경 앨범', 'album-awards': '입상작 앨범' };
        const $ = id => document.getElementById(id);
        const el = (tag, text) => { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; return e; };
        const fmt = n => Number(n).toLocaleString('ko-KR');
        function bars(box, data, names) {
            const list = Object.entries(data).sort((a, b) => b[1] - a[1]), max = Math.max(1, ...list.map(x => x[1]));
            for (const [k, n] of list) { const bar = el('i'); bar.style.width = (n / max * 100) + '%'; box.append(el('span', (names && names[k]) || k), bar, el('em', fmt(n))); }
            if (!list.length) box.append(el('span', '아직 기록이 없습니다'));
        }
        try {
            const s = await (await fetch(REALTIME.replace(/\/$/, '') + '/stats?days=90')).json();
            const sum = k => s.days.reduce((a, d) => a + d[k], 0);
            for (const [n, label] of [[s.visits, '누적 방문'], [s.flowers, '누적 헌화'], [s.here, '지금 전시관에'], [sum('visits'), '최근 90일 방문'], [sum('pages'), '최근 90일 페이지 열람']]) {
                const t = el('div'); t.className = 'tile'; t.append(el('b', fmt(n)), el('span', label)); $('tiles').append(t);
            }
            const max = Math.max(1, ...s.days.map(d => d.visits));
            for (const d of s.days) { const b = el('i'); b.style.height = (d.visits / max * 100) + '%'; b.title = d.day + ' · ' + fmt(d.visits); $('days').append(b); }
            if (s.days.length) { $('d0').textContent = s.days[0].day; $('d1').textContent = s.days[s.days.length - 1].day; }
            const langNames = {};
            try { for (const l of (await (await fetch('data/i18n.json')).json()).langs) langNames[l.code] = l.name; } catch (e) { /* codes will do */ }
            bars($('langs'), s.langs, langNames);
            bars($('pages'), s.pages, NAMES);
            for (const d of [...s.days].reverse()) { const tr = el('tr'); tr.append(el('td', d.day), el('td', fmt(d.visits)), el('td', fmt(d.pages)), el('td', fmt(d.flowers))); $('rows').append(tr); }
        } catch (e) { $('error').hidden = false; }
    </script>
</body>
</html>
